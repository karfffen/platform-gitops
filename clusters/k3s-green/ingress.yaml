# Separate from platform so a failing chart cannot block the other manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 10m
  prune: false
  serviceAccountName: kustomize-controller
  path: ./clusters/k3s-green/ingress
  sourceRef:
    kind: GitRepository
    name: flux-system
