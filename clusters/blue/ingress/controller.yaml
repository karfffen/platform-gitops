# Pins the add-on's default ingress controller to this cluster's static IP (ADR-0015 section 2).
# The IP is referenced by name and resource group, so no address is stored here.
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: default
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  controllerNamePrefix: nginx
  # One replica: the add-on defaults to 2, which do not fit on the single 2-vCPU node (issue #114).
  scaling:
    minReplicas: 1
    maxReplicas: 1
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-pip-name: pip-lab-blue-sc-ingress
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-lab-blue-sc
