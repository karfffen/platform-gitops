# Deny by default in every workload namespace, then the minimum allow rules from ADR-0007.
# flux-system is created and managed by the Flux extension and is left alone. Flux talks to the
# API server and to GitHub, never to pods in these namespaces, so no Flux rule is needed here.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: frontend
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: frontend
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The ingress controller (application routing add-on namespace) may reach the web pods
# (hello-world and the TodoApp web service) on their container ports, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: frontend
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - hello-world
          - todoapp-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
# The TodoApp web pods may call the API pods in backend, and nothing else (no internet, no VNet).
# The name is historic: renaming would delete the policy, so it was narrowed in place (#203).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-backend-and-internet
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: todoapp-web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tier: backend
          podSelector:
            matchLabels:
              app: todoapp-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: backend
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: backend
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Backend accepts traffic only on the API pods, from the TodoApp web pods in frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-frontend-and-backend
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: todoapp-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: frontend
          podSelector:
            matchLabels:
              app: todoapp-web
      ports:
        - protocol: TCP
          port: 8080
---
# Backend pods get no egress beyond DNS (allow-dns). The API uses SQLite on emptyDir and calls
# nothing else. The private-endpoint ranges from ADR-0007 get a rule when something needs them.
# The name is historic: renaming would delete the policy, so it was emptied in place (#203).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-backend-and-privatelink
  namespace: backend
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []
---
# TodoApp namespace: deny by default, then DNS, the ingress controller to the web pods, and the
# web pods to the API pods. The API keeps SQLite on emptyDir, so it needs no egress (#221).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: todoapp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: todoapp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: todoapp
spec:
  podSelector:
    matchLabels:
      app: todoapp-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
  namespace: todoapp
spec:
  podSelector:
    matchLabels:
      app: todoapp-web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: todoapp-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-web
  namespace: todoapp
spec:
  podSelector:
    matchLabels:
      app: todoapp-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: todoapp-web
      ports:
        - protocol: TCP
          port: 8080
