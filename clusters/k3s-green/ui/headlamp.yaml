# Read-only web UI (ADR-0026 section 4): Headlamp with its Flux plugin, at http://<VM address>/headlamp/ (/headlamp redirects there).
# Headlamp calls the API with the token you sign in with, so what you can do is what that token can do.
# The only token meant for it is headlamp-viewer's, bound to the built-in `view` ClusterRole: it can
# read, not change or delete (rule 2). Create one on the VM, never commit it:
#   sudo docker exec k3s-lab-<colour> kubectl -n headlamp create token headlamp-viewer --duration=24h
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: headlamp
  releaseName: headlamp
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    # The chart's default binds Headlamp's own account to cluster-admin; it needs none.
    clusterRoleBinding:
      create: false
    config:
      baseURL: /headlamp
      pluginsDir: /build/plugins
    initContainers:
      - name: flux-plugin
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        command: ["/bin/sh", "-c", "mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/"]
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
---
# Reached through Traefik on the VM, from the owner's Mac only (Fusion NAT).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-headlamp-slash@kubernetescrd
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /headlamp
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
---
# Headlamp serves only under /headlamp/ (its baseURL with the slash): send /headlamp there.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-slash
  namespace: headlamp
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/headlamp)$
    replacement: ${1}/
    permanent: false
---
# Deny by default like every namespace (ADR-0007), then only what Headlamp needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - protocol: TCP
          port: 4466
---
# Headlamp talks only to the k3s API server (6443 on the node).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
