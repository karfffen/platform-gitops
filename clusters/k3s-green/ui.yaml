apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ui
  namespace: flux-system
spec:
  interval: 10m
  prune: false
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: ingress
  path: ./clusters/k3s-green/ui
  sourceRef:
    kind: GitRepository
    name: flux-system
