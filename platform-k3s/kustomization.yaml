# The shared platform for the k3s clusters (ADR-0026 section 4): everything in ../platform, with the
# Azure-only parts swapped. TodoApp's StorageClass uses k3s's local-path provisioner, and the Azure Disk
# snapshot class is left out (k3s has no snapshot CRDs). The AKS clusters keep reading ./platform.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../platform
patches:
  - target:
      kind: StorageClass
      name: todoapp-disk
    patch: |
      - op: replace
        path: /provisioner
        value: rancher.io/local-path
      - op: remove
        path: /parameters
  - target:
      kind: VolumeSnapshotClass
      name: todoapp-disk-snapshot
    patch: |
      $patch: delete
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: todoapp-disk-snapshot
