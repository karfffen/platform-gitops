# Sized from blue's free capacity in docs/app-candidates.md (estimate: about 1800m CPU and 11 GiB
# free on the 4 vCPU node; #163 could not reach blue). With 20% spare (ADR-0016) the two namespaces
# together may request at most about 1400m and 8.5 GiB. Requests here total 1000m and 1.5 GiB
# (hello-world uses 25m and 32Mi of that); limits may overcommit. Raised for the TodoApp in #203.
# The LimitRange gives pods without requests a small default so the quota still admits them.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: frontend
spec:
  hard:
    pods: "10"
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: 1000m
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: frontend
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: backend
spec:
  hard:
    pods: "10"
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: 1000m
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: backend
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 100m
        memory: 256Mi
