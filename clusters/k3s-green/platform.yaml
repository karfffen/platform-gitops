# Reads ./platform-k3s: the shared platform with the Azure-only storage parts swapped (ADR-0026 section 4).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  prune: false
  path: ./platform-k3s
  sourceRef:
    kind: GitRepository
    name: flux-system
